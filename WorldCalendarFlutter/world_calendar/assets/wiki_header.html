<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0 3%;
            font-size: 16px; /* 고정 px 추천 */
            line-height: 1.2;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        img {
            width: 100%;
            height: auto;
        }
        div.thumb, li {
            margin-bottom: 1em;
        }
        .trow {
            display: flex;
            flex-direction: row;
            clear: left;
            flex-wrap: wrap;
            width: 100%;
            box-sizing: border-box;
            justify-content: center;
        }
        .tsingle.left {
            width: calc(50% - 1em);
            margin-right: 0.5em;
        }
        .tsingle.right {
            width: calc(50% - 1em);
            margin-left: 0.5em;
        }
        figure {
            margin-block-start: 0em;
            margin-block-end: 0em;
            margin-inline-start: 0px;
            margin-inline-end: 0px;
        }
        ul {
            margin-block-start: 1em;
            margin-block-end: 1em;
            padding-inline-start: 20px;
        }
    </style>
</head>
